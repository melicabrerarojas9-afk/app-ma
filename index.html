<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Taller - Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .pulse-mic {
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(225, 29, 72, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
    </style>
</head>
<body class="pb-24 text-slate-800">

    <!-- Navbar Superior -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/80 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white shadow-md shadow-rose-500/20">
                <i class="fa-solid fa-scissors text-sm"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-slate-800 text-base leading-tight">Mi Agenda Taller</h1>
                <p id="lblFechaHoy" class="text-[11px] text-rose-500 font-bold">Cargando fecha...</p>
            </div>
        </div>
        <button id="btnNotif" onclick="activarAvisos()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition-all active:scale-95 border border-rose-200">
            <i class="fa-solid fa-bell text-rose-500"></i>
            <span id="txtBtnNotif">Activar Avisos</span>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Zona de Dictado Principal -->
        <section class="bg-gradient-to-b from-white to-slate-50 rounded-3xl p-5 shadow-sm border border-slate-200/80 text-center relative overflow-hidden">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-rose-400 to-pink-500 rounded-b-full"></div>
            
            <p class="text-[10px] font-extrabold uppercase tracking-wider text-rose-500 mb-1">Dictado Inteligente</p>
            <h2 class="text-base font-bold text-slate-800 mb-3">Toca para hablar y completar</h2>

            <!-- Botón Micrófono -->
            <div class="relative w-20 h-20 mx-auto mb-3 flex items-center justify-center">
                <button id="btnMic" onclick="toggleDictado()" class="w-16 h-16 bg-gradient-to-tr from-rose-500 to-pink-500 text-white rounded-full flex items-center justify-center text-2xl shadow-lg shadow-rose-500/30 transition-all active:scale-90 z-10">
                    <i id="micIcon" class="fa-solid fa-microphone"></i>
                </button>
            </div>

            <div id="statusDictado" class="text-xs font-bold text-slate-500">Tocá para escuchar</div>

            <div class="mt-3 p-3 bg-white rounded-2xl border border-slate-200/60 text-left shadow-inner">
                <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-0.5">Ejemplo de dictado:</span>
                <p class="text-[11px] text-slate-600 italic leading-snug">
                    "Retiré dos pantalones, un vestido y toallas de Daniela en Nordelta. Devolver el 1 de octubre."
                </p>
            </div>
        </section>

        <!-- Formulario Autocompletado -->
        <section id="secFormulario" class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-rose-500"></i>
                    <span>Datos Detectados</span>
                </h3>
                <span class="text-[10px] font-extrabold uppercase bg-rose-50 text-rose-600 px-2.5 py-1 rounded-full">Automático</span>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Clienta</label>
                    <input type="text" id="inputCliente" placeholder="Ej: Daniela" class="w-full px-3 py-2 bg-slate-50 rounded-xl text-xs font-bold text-slate-700 border border-slate-200/80 focus:bg-white focus:ring-2 focus:ring-rose-400 outline-none">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Zona / Barrio</label>
                    <input type="text" id="inputUbicacion" placeholder="Ej: Nordelta" class="w-full px-3 py-2 bg-slate-50 rounded-xl text-xs font-bold text-slate-700 border border-slate-200/80 focus:bg-white focus:ring-2 focus:ring-rose-400 outline-none">
                </div>
            </div>

            <div>
                <label class="text-[11px] font-semibold text-slate-400 block mb-1">Lista de Tareas (Limpias)</label>
                <textarea id="inputTareas" rows="3" placeholder="Se armará el listado..." class="w-full px-3 py-2 bg-slate-50 rounded-xl text-xs font-semibold text-slate-700 border border-slate-200/80 focus:bg-white focus:ring-2 focus:ring-rose-400 outline-none leading-relaxed"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Retirado el (Hoy)</label>
                    <input type="text" id="inputFechaRetiro" readonly class="w-full px-3 py-2 bg-slate-100 rounded-xl text-xs font-semibold text-slate-500 border border-slate-200/60 cursor-not-allowed">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Fecha de Entrega</label>
                    <input type="date" id="inputFecha" class="w-full px-3 py-2 bg-slate-50 rounded-xl text-xs font-bold text-rose-600 border border-slate-200/80 focus:bg-white focus:ring-2 focus:ring-rose-400 outline-none">
                </div>
            </div>

            <button onclick="guardarTrabajo()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-3 rounded-2xl shadow-lg shadow-slate-900/10 active:scale-98 transition-all flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Guardar en la Agenda</span>
            </button>
        </section>

        <!-- Lista / Agenda -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-calendar-week text-rose-500"></i>
                    <span>Trabajos Pendientes</span>
                </h3>
                <span id="cantTrabajos" class="text-xs font-bold bg-rose-100 text-rose-600 px-2.5 py-0.5 rounded-full">0</span>
            </div>

            <div id="listaTrabajos" class="space-y-3">
                <!-- Se llena dinámicamente -->
            </div>
        </section>

    </main>

    <script>
        let trabajos = JSON.parse(localStorage.getItem('agenda_modista_v2')) || [];
        let rec = null;
        let escuchando = false;

        // Fecha de Hoy
        const hoyObj = new Date();
        const fechaHoyISO = hoyObj.toISOString().split('T')[0];
        document.getElementById('lblFechaHoy').innerText = `Hoy: ${formatearFechaLarga(fechaHoyISO)}`;
        document.getElementById('inputFechaRetiro').value = fechaHoyISO;

        // Reconocimiento de Voz
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            rec = new SpeechRecognition();
            rec.lang = 'es-AR';
            rec.continuous = false;

            rec.onstart = () => {
                escuchando = true;
                document.getElementById('btnMic').classList.add('pulse-mic');
                document.getElementById('micIcon').className = 'fa-solid fa-square';
                document.getElementById('statusDictado').innerText = 'Escuchando... Dictá tranquila.';
            };

            rec.onend = () => {
                escuchando = false;
                document.getElementById('btnMic').classList.remove('pulse-mic');
                document.getElementById('micIcon').className = 'fa-solid fa-microphone';
                document.getElementById('statusDictado').innerText = 'Tocá para escuchar';
            };

            rec.onresult = (e) => {
                const texto = e.results[0][0].transcript;
                procesarDictadoInteligente(texto);
            };
        }

        function toggleDictado() {
            if (!rec) {
                alert('El dictado por voz funciona mejor en Google Chrome o Samsung Internet.');
                return;
            }
            if (escuchando) { rec.stop(); } else { rec.start(); }
        }

        // PROCESADOR INTELIGENTE (FILTRADO DE TAREAS Y FECHAS)
        function procesarDictadoInteligente(t) {
            const txt = t.toLowerCase();

            // 1. EXTRAER CLIENTA
            let cliente = "";
            const matchCliente = txt.match(/(?:señora|sra|de|para)\s+([a-záéíóúñ]+)/i);
            if (matchCliente && !['la', 'un', 'una', 'dos', 'los', 'las'].includes(matchCliente[1])) {
                cliente = capitalizar(matchCliente[1]);
            }

            // 2. EXTRAER BARRIO / UBICACIÓN
            let ubicacion = "";
            const barrios = ['nordelta', 'martínez', 'martinez', 'san isidro', 'olivos', 'tigre', 'vicente lópez', 'san fernando', 'beccar', 'boulogne', 'pilar', 'escobar'];
            barrios.forEach(b => {
                if (txt.includes(b)) ubicacion = capitalizar(b);
            });

            // 3. DESGLOSAR TAREAS LIMPIAS (LISTADO)
            let tareasArray = [];
            
            // Detectar palabras clave y limpiar
            if (txt.includes('pantalon') || txt.includes('pantalones')) {
                const cant = txt.includes('dos pantalones') ? '2 pantalones' : 'Pantalón';
                tareasArray.push(`• Ruedo / Arreglo de ${cant}`);
            }
            if (txt.includes('vestido')) tareasArray.push('• Arreglo de Vestido');
            if (txt.includes('toalla') || txt.includes('toallas')) tareasArray.push('• Costura de Toallas');
            if (txt.includes('cierre') || txt.includes('campera')) tareasArray.push('• Cambio de Cierre');
            if (txt.includes('remera') || txt.includes('rotura') || txt.includes('zurcido')) tareasArray.push('• Zurcido / Rotura');
            if (txt.includes('disfraz') || txt.includes('juguete')) tareasArray.push('• Confección especial');

            // Si no matcheó palabras específicas, limpiar frase
            if (tareasArray.length === 0) {
                let limpia = t.replace(/(retiré|tengo que devolver|de la señora|en Nordelta|en Martínez|lo tengo que entregar|el \d+ de \w+)/gi, '').trim();
                tareasArray.push(`• ${capitalizar(limpia)}`);
            }

            // 4. EXTRAER FECHA DE ENTREGA DICTADA
            let fechaEntrega = new Date();
            
            // Buscar patrones tipo "1 de octubre"
            const meses = { 'enero':0, 'febrero':1, 'marzo':2, 'abril':3, 'mayo':4, 'junio':5, 'julio':6, 'agosto':7, 'septiembre':8, 'octubre':9, 'noviembre':10, 'diciembre':11 };
            const matchFechaEspecial = txt.match(/(\d{1,2})\s+de\s+([a-z]+)/i);

            if (matchFechaEspecial) {
                const diaNum = parseInt(matchFechaEspecial[1]);
                const mesNombre = matchFechaEspecial[2].toLowerCase();
                if (meses[mesNombre] !== undefined) {
                    fechaEntrega.setMonth(meses[mesNombre]);
                    fechaEntrega.setDate(diaNum);
                }
            } else if (txt.includes('mañana')) {
                fechaEntrega.setDate(fechaEntrega.getDate() + 1);
            } else if (txt.includes('semana que viene')) {
                fechaEntrega.setDate(fechaEntrega.getDate() + 7);
            } else {
                fechaEntrega.setDate(fechaEntrega.getDate() + 3); // 3 días por defecto
            }

            // Completar los campos limpios
            document.getElementById('inputCliente').value = cliente || "Clienta";
            document.getElementById('inputUbicacion').value = ubicacion;
            document.getElementById('inputTareas').value = tareasArray.join('\n');
            document.getElementById('inputFecha').value = fechaEntrega.toISOString().split('T')[0];

            hablar(`Anotado para ${cliente || 'la clienta'}. ${tareasArray.length} tareas detectadas.`);
        }

        function hablar(msj) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(msj);
                u.lang = 'es-AR';
                window.speechSynthesis.speak(u);
            }
        }

        function capitalizar(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function guardarTrabajo() {
            const cliente = document.getElementById('inputCliente').value;
            const tareas = document.getElementById('inputTareas').value;
            const fechaEntrega = document.getElementById('inputFecha').value;

            if (!cliente || !tareas) {
                alert('Por favor completá los datos del trabajo.');
                return;
            }

            const nuevo = {
                id: Date.now(),
                cliente,
                ubicacion: document.getElementById('inputUbicacion').value,
                tareas,
                fechaRetiro: fechaHoyISO,
                fechaEntrega,
                completado: false
            };

            trabajos.unshift(nuevo);
            guardarLocal();
            renderTrabajos();
            limpiarForm();
        }

        // CALCULAR NIVEL DE URGENCIA
        function obtenerCartelUrgencia(fechaEntregaStr) {
            if (!fechaEntregaStr) return { texto: 'Sin Fecha', clase: 'bg-slate-100 text-slate-600' };

            const fEntrega = new Date(fechaEntregaStr + 'T00:00:00');
            const fHoy = new Date(fechaHoyISO + 'T00:00:00');
            const difDias = Math.ceil((fEntrega - fHoy) / (1000 * 60 * 60 * 24));

            if (difDias < 0) {
                return { texto: '🚨 RETRASADO', clase: 'bg-rose-600 text-white animate-pulse' };
            } else if (difDias <= 1) {
                return { texto: '🔴 URGENTE (1 día)', clase: 'bg-rose-500 text-white font-extrabold' };
            } else if (difDias <= 3) {
                return { texto: `🟠 PRÓXIMO (${difDias} días)`, clase: 'bg-amber-500 text-white font-bold' };
            } else {
                return { texto: `🟢 A TIEMPO (${difDias} días)`, clase: 'bg-emerald-500 text-white font-bold' };
            }
        }

        function renderTrabajos() {
            const cont = document.getElementById('listaTrabajos');
            document.getElementById('cantTrabajos').innerText = trabajos.filter(t => !t.completado).length;
            cont.innerHTML = '';

            if (trabajos.length === 0) {
                cont.innerHTML = `
                    <div class="text-center py-8 bg-white rounded-3xl border border-slate-200/60 p-4">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-2"></i>
                        <p class="text-xs font-bold text-slate-600">¡Agenda al día!</p>
                        <p class="text-[11px] text-slate-400">No hay trabajos pendientes cargados.</p>
                    </div>
                `;
                return;
            }

            trabajos.forEach(t => {
                const urgencia = obtenerCartelUrgencia(t.fechaEntrega);
                const div = document.createElement('div');
                div.className = `bg-white p-4 rounded-3xl border ${t.completado ? 'opacity-50 border-slate-200' : 'border-slate-200/80 shadow-sm'} space-y-2.5`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-extrabold text-slate-800 text-sm ${t.completado ? 'line-through text-slate-400' : ''}">${t.cliente}</h4>
                            ${t.ubicacion ? `<span class="text-[11px] text-slate-400 font-semibold"><i class="fa-solid fa-location-dot text-rose-400"></i> ${t.ubicacion}</span>` : ''}
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            ${!t.completado ? `<span class="text-[10px] px-2.5 py-0.5 rounded-full ${urgencia.clase}">${urgencia.texto}</span>` : ''}
                            <button onclick="toggleEstado(${t.id})" class="text-[11px] px-2.5 py-0.5 rounded-full font-bold ${t.completado ? 'bg-slate-100 text-slate-500' : 'bg-rose-50 text-rose-600 hover:bg-rose-100'}">
                                ${t.completado ? '✓ Listo' : 'Marcar Listo'}
                            </button>
                        </div>
                    </div>

                    <!-- TAREAS DESGLOSADAS -->
                    <div class="text-xs text-slate-700 font-medium bg-slate-50 p-3 rounded-2xl border border-slate-100 leading-relaxed whitespace-pre-line">${t.tareas}</div>

                    <div class="flex justify-between items-center pt-1 text-[11px]">
                        <div class="text-slate-400">
                            <span class="block text-[10px]">Retiro: ${t.fechaRetiro || 'Hoy'}</span>
                            <span class="font-bold text-slate-700">Entrega: ${t.fechaEntrega || 'Sin fecha'}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="enviarWhatsApp('${t.cliente}', '${t.fechaEntrega}', \`${t.tareas.replace(/\n/g, ', ')}\`)" class="text-emerald-600 font-bold bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-xl flex items-center gap-1">
                                <i class="fa-brands fa-whatsapp text-xs"></i> Avisar
                            </button>
                            <button onclick="borrarTrabajo(${t.id})" class="text-slate-300 hover:text-rose-500 p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
                cont.appendChild(div);
            });
        }

        function toggleEstado(id) {
            trabajos = trabajos.map(t => t.id === id ? {...t, completado: !t.completado} : t);
            guardarLocal();
            renderTrabajos();
        }

        function borrarTrabajo(id) {
            trabajos = trabajos.filter(t => t.id !== id);
            guardarLocal();
            renderTrabajos();
        }

        function enviarWhatsApp(cliente, fecha, tareas) {
            const texto = `¡Hola ${cliente}! Te aviso que ya tengo anotados tus arreglos:\n${tareas}\n\nFecha estimada de entrega: ${fecha}. ¡Un saludo!`;
            window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
        }

        function limpiarForm() {
            document.getElementById('inputCliente').value = '';
            document.getElementById('inputUbicacion').value = '';
            document.getElementById('inputTareas').value = '';
            document.getElementById('inputFecha').value = '';
        }

        function guardarLocal() {
            localStorage.setItem('agenda_modista_v2', JSON.stringify(trabajos));
        }

        function formatearFechaLarga(fechaStr) {
            const partes = fechaStr.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // ACTIVADOR DE AVISOS Y NOTIFICACIONES
        function activarAvisos() {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        document.getElementById('txtBtnNotif').innerText = 'Avisos Listos ✓';
                        document.getElementById('btnNotif').className = 'bg-emerald-50 text-emerald-600 text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 border border-emerald-200';
                        alert('¡Avisos activados con éxito! Te avisaremos cuando tengas entregas urgentes.');
                    } else {
                        alert('No se otorgaron permisos de notificación en el navegador.');
                    }
                });
            } else {
                alert('Los avisos funcionan mediante alertas internas en este dispositivo.');
            }
        }

        renderTrabajos();
    </script>
</body>
</html>
