<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Taller IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .pulse-mic { animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(225, 29, 72, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
    </style>
</head>
<body class="pb-24 text-slate-800">

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/80 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white shadow-md shadow-rose-500/20">
                <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-slate-800 text-base leading-tight">Mi Agenda IA</h1>
                <p id="lblFechaHoy" class="text-[11px] text-rose-500 font-bold">Cargando fecha...</p>
            </div>
        </div>
        <button id="btnApiKey" onclick="configurarAPIKey()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 border border-slate-200">
            <i class="fa-solid fa-key text-rose-500"></i> <span id="txtBtnKey">Cargar Clave</span>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <section class="bg-gradient-to-b from-white to-slate-50 rounded-3xl p-5 shadow-sm border border-slate-200/80 text-center relative overflow-hidden">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-rose-400 to-pink-500 rounded-b-full"></div>
            
            <p class="text-[10px] font-extrabold uppercase tracking-wider text-rose-500 mb-1">Dictado por Voz</p>
            <h2 class="text-base font-bold text-slate-800 mb-3">Tocá y dictá todo de corrido</h2>

            <div class="relative w-20 h-20 mx-auto mb-3 flex items-center justify-center">
                <button id="btnMic" onclick="toggleDictado()" class="w-16 h-16 bg-gradient-to-tr from-rose-500 to-pink-500 text-white rounded-full flex items-center justify-center text-2xl shadow-lg shadow-rose-500/30 transition-all active:scale-90 z-10">
                    <i id="micIcon" class="fa-solid fa-microphone"></i>
                </button>
            </div>

            <div id="statusDictado" class="text-xs font-bold text-slate-500">Tocá para hablar</div>
            <div id="loaderIA" class="hidden text-xs font-bold text-rose-600 animate-pulse mt-2"><i class="fa-solid fa-spinner fa-spin"></i> La IA está organizando el pedido...</div>
        </section>

        <section id="secFormulario" class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-rose-500"></i>
                    <span>Pedido Detectado</span>
                </h3>
                <span id="badgeEstadoIA" class="text-[10px] font-extrabold uppercase bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full">Sin procesar</span>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Clienta</label>
                    <input type="text" id="inputCliente" placeholder="Nombre de la clienta" class="w-full px-3 py-2 bg-slate-50 rounded-xl text-xs font-bold text-slate-700 border border-slate-200/80 outline-none">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Zona / Barrio</label>
                    <input type="text" id="inputUbicacion" placeholder="Ej: San Isidro Chico" class="w-full px-3 py-2 bg-slate-50 rounded-xl text-xs font-bold text-slate-700 border border-slate-200/80 outline-none">
                </div>
            </div>

            <div>
                <label class="text-[11px] font-semibold text-slate-400 block mb-1">Prendas y Trabajos a realizar</label>
                <textarea id="inputTareas" rows="4" placeholder="Lista de prendas..." class="w-full px-3 py-2 bg-slate-50 rounded-xl text-xs font-semibold text-slate-700 border border-slate-200/80 outline-none leading-relaxed"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Retirado el (Hoy)</label>
                    <input type="text" id="inputFechaRetiro" readonly class="w-full px-3 py-2 bg-slate-100 rounded-xl text-xs font-semibold text-slate-500 border border-slate-200/60 cursor-not-allowed">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Fecha de Entrega</label>
                    <input type="date" id="inputFecha" class="w-full px-3 py-2 bg-slate-50 rounded-xl text-xs font-bold text-rose-600 border border-slate-200/80 outline-none">
                </div>
            </div>

            <button onclick="guardarTrabajo()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-3 rounded-2xl shadow-lg shadow-slate-900/10 active:scale-98 transition-all flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Guardar en la Agenda</span>
            </button>
        </section>

        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-calendar-week text-rose-500"></i>
                    <span>Trabajos Pendientes</span>
                </h3>
                <span id="cantTrabajos" class="text-xs font-bold bg-rose-100 text-rose-600 px-2.5 py-0.5 rounded-full">0</span>
            </div>

            <div id="listaTrabajos" class="space-y-3"></div>
        </section>

    </main>

    <script>
        let trabajos = JSON.parse(localStorage.getItem('agenda_modista_v3')) || [];
        let apiKey = localStorage.getItem('gemini_api_key') || "";
        let rec = null;
        let escuchando = false;

        const hoyObj = new Date();
        const fechaHoyISO = hoyObj.toISOString().split('T')[0];
        document.getElementById('lblFechaHoy').innerText = `Hoy: ${formatearFechaLarga(fechaHoyISO)}`;
        document.getElementById('inputFechaRetiro').value = fechaHoyISO;

        actualizarEstadoBotonKey();

        function actualizarEstadoBotonKey() {
            if (apiKey) {
                document.getElementById('txtBtnKey').innerText = "IA Activa ✓";
                document.getElementById('btnApiKey').className = "bg-emerald-50 text-emerald-700 text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 border border-emerald-200";
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            rec = new SpeechRecognition();
            rec.lang = 'es-AR';
            rec.continuous = false;

            rec.onstart = () => {
                escuchando = true;
                document.getElementById('btnMic').classList.add('pulse-mic');
                document.getElementById('micIcon').className = 'fa-solid fa-square';
                document.getElementById('statusDictado').innerText = 'Escuchando... Hablá tranquila.';
            };

            rec.onend = () => {
                escuchando = false;
                document.getElementById('btnMic').classList.remove('pulse-mic');
                document.getElementById('micIcon').className = 'fa-solid fa-microphone';
                document.getElementById('statusDictado').innerText = 'Tocá para hablar';
            };

            rec.onresult = (e) => {
                const texto = e.results[0][0].transcript;
                procesarDictadoConIA(texto);
            };
        }

        function toggleDictado() {
            if (!rec) {
                alert('El dictado funciona mejor en Google Chrome o Samsung Internet.');
                return;
            }
            if (escuchando) { rec.stop(); } else { rec.start(); }
        }

        async function procesarDictadoConIA(textoOriginal) {
            document.getElementById('loaderIA').classList.remove('hidden');

            if (apiKey) {
                try {
                    const prompt = `Sos el asistente de un taller de costura. Analizá el siguiente audio dictado por la modista y extraé los datos en formato JSON estricto.

Texto dictado: "${textoOriginal}"

Fecha de hoy: ${fechaHoyISO} (${hoyObj.getFullYear()}).

Respondé ÚNICAMENTE con un objeto JSON con este formato (sin bloques markdown ni explicaciones):
{
  "clienta": "Nombre de la clienta (omitir palabras como 'retiro', 'señora', 'de la casa')",
  "barrio": "Barrio o ubicación mencionada (ej: San Isidro Chico)",
  "tareas": ["Lista detallada de cada prenda con su arreglo (ej: 'Agrandar vestido al largo', '3 pantalones sastreros (hacer ruedo)', '1 cartera (arreglar y cambiar cierre)')"],
  "fechaEntrega": "Fecha en formato YYYY-MM-DD. Si dice 'mañana' es el día posterior a hoy (${fechaHoyISO}). Si dice un día específico calcúlalo respecto a hoy."
}`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();
                    let rawText = data.candidates[0].content.parts[0].text;
                    rawText = rawText.replace(/```json|```/g, '').trim();
                    const jsonRes = JSON.parse(rawText);

                    document.getElementById('inputCliente').value = jsonRes.clienta || "";
                    document.getElementById('inputUbicacion').value = jsonRes.barrio || "";
                    document.getElementById('inputTareas').value = jsonRes.tareas ? jsonRes.tareas.map(t => `• ${t}`).join('\n') : textoOriginal;
                    document.getElementById('inputFecha').value = jsonRes.fechaEntrega || "";

                    document.getElementById('badgeEstadoIA').innerText = "Procesado con IA ✓";
                    document.getElementById('badgeEstadoIA').className = "text-[10px] font-extrabold uppercase bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full";
                    document.getElementById('loaderIA').classList.add('hidden');
                    return;
                } catch (err) {
                    console.error("Error al consultar la IA:", err);
                    alert("Hubo un detalle al conectar con la IA. Asegurate de que la clave cargada sea válida.");
                }
            }

            // Si no hay API Key o falla, se cargan los datos crudos reales (NUNCA DATOS FALSOS)
            document.getElementById('inputCliente').value = "";
            document.getElementById('inputUbicacion').value = "";
            document.getElementById('inputTareas').value = textoOriginal;
            document.getElementById('inputFecha').value = "";
            document.getElementById('badgeEstadoIA').innerText = "Modo Básico (Sin Key)";
            document.getElementById('badgeEstadoIA').className = "text-[10px] font-extrabold uppercase bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full";

            document.getElementById('loaderIA').classList.add('hidden');
        }

        function configurarAPIKey() {
            const key = prompt("Pegá tu API Key de Gemini aquí:", apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
                actualizarEstadoBotonKey();
                if(apiKey) alert("¡Clave cargada e instalada con éxito!");
            }
        }

        function guardarTrabajo() {
            const cliente = document.getElementById('inputCliente').value || "Clienta";
            const tareas = document.getElementById('inputTareas').value;
            const fechaEntrega = document.getElementById('inputFecha').value;

            if (!tareas) { alert('Por favor dictá o escribí las tareas.'); return; }

            const nuevo = {
                id: Date.now(),
                cliente,
                ubicacion: document.getElementById('inputUbicacion').value,
                tareas,
                fechaRetiro: fechaHoyISO,
                fechaEntrega,
                completado: false
            };

            trabajos.unshift(nuevo);
            guardarLocal();
            renderTrabajos();
            limpiarForm();
        }

        function obtenerCartelUrgencia(fechaEntregaStr) {
            if (!fechaEntregaStr) return { texto: 'Sin Fecha', clase: 'bg-slate-100 text-slate-600' };

            const fEntrega = new Date(fechaEntregaStr + 'T00:00:00');
            const fHoy = new Date(fechaHoyISO + 'T00:00:00');
            const difDias = Math.ceil((fEntrega - fHoy) / (1000 * 60 * 60 * 24));

            if (difDias < 0) return { texto: '🚨 RETRASADO', clase: 'bg-rose-600 text-white animate-pulse' };
            if (difDias <= 1) return { texto: '🔴 URGENTE (Para Mañana/Hoy)', clase: 'bg-rose-500 text-white font-extrabold' };
            if (difDias <= 3) return { texto: `🟠 PRÓXIMO (${difDias} días)`, clase: 'bg-amber-500 text-white font-bold' };
            return { texto: `🟢 A TIEMPO (${difDias} días)`, clase: 'bg-emerald-500 text-white font-bold' };
        }

        function renderTrabajos() {
            const cont = document.getElementById('listaTrabajos');
            document.getElementById('cantTrabajos').innerText = trabajos.filter(t => !t.completado).length;
            cont.innerHTML = '';

            if (trabajos.length === 0) {
                cont.innerHTML = `<div class="text-center py-8 bg-white rounded-3xl border border-slate-200/60 p-4"><i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-2"></i><p class="text-xs font-bold text-slate-600">¡Agenda al día!</p></div>`;
                return;
            }

            trabajos.forEach(t => {
                const urgencia = obtenerCartelUrgencia(t.fechaEntrega);
                const div = document.createElement('div');
                div.className = `bg-white p-4 rounded-3xl border ${t.completado ? 'opacity-50 border-slate-200' : 'border-slate-200/80 shadow-sm'} space-y-2.5`;
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-extrabold text-slate-800 text-sm ${t.completado ? 'line-through text-slate-400' : ''}">${t.cliente}</h4>
                            ${t.ubicacion ? `<span class="text-[11px] text-slate-400 font-semibold"><i class="fa-solid fa-location-dot text-rose-400"></i> ${t.ubicacion}</span>` : ''}
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            ${!t.completado ? `<span class="text-[10px] px-2.5 py-0.5 rounded-full ${urgencia.clase}">${urgencia.texto}</span>` : ''}
                            <button onclick="toggleEstado(${t.id})" class="text-[11px] px-2.5 py-0.5 rounded-full font-bold ${t.completado ? 'bg-slate-100 text-slate-500' : 'bg-rose-50 text-rose-600 hover:bg-rose-100'}">
                                ${t.completado ? '✓ Listo' : 'Marcar Listo'}
                            </button>
                        </div>
                    </div>
                    <div class="text-xs text-slate-700 font-medium bg-slate-50 p-3 rounded-2xl border border-slate-100 leading-relaxed whitespace-pre-line">${t.tareas}</div>
                    <div class="flex justify-between items-center pt-1 text-[11px]">
                        <div class="text-slate-400">
                            <span class="block text-[10px]">Retiro: ${t.fechaRetiro || 'Hoy'}</span>
                            <span class="font-bold text-slate-700">Entrega: ${t.fechaEntrega || 'Sin fecha'}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="enviarWhatsApp('${t.cliente}', '${t.fechaEntrega}')" class="text-emerald-600 font-bold bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-xl flex items-center gap-1">
                                <i class="fa-brands fa-whatsapp text-xs"></i> Avisar
                            </button>
                            <button onclick="borrarTrabajo(${t.id})" class="text-slate-300 hover:text-rose-500 p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
                cont.appendChild(div);
            });
        }

        function toggleEstado(id) { trabajos = trabajos.map(t => t.id === id ? {...t, completado: !t.completado} : t); guardarLocal(); renderTrabajos(); }
        function borrarTrabajo(id) { trabajos = trabajos.filter(t => t.id !== id); guardarLocal(); renderTrabajos(); }
        function enviarWhatsApp(cliente, fecha) { window.open(`https://wa.me/?text=${encodeURIComponent(`¡Hola ${cliente}! Te aviso que tus prendas están listas para entregar. Un saludo!`)}`, '_blank'); }
        function limpiarForm() { document.getElementById('inputCliente').value = ''; document.getElementById('inputUbicacion').value = ''; document.getElementById('inputTareas').value = ''; document.getElementById('inputFecha').value = ''; }
        function guardarLocal() { localStorage.setItem('agenda_modista_v3', JSON.stringify(trabajos)); }
        function formatearFechaLarga(fechaStr) { const partes = fechaStr.split('-'); return `${partes[2]}/${partes[1]}/${partes[0]}`; }

        renderTrabajos();
    </script>
</body>
</html>
